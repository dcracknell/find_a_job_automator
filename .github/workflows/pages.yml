name: Deploy Site

# Publishes GitHub Pages from two inputs:
#   - docs/            → setup UI (index.html, preferences.html)
#   - job-search-data  → data/dashboard.html, served as jobs.html
# Runs on docs changes AND after every pipeline run, so the jobs page
# stays fresh without committing generated HTML to main.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ["Daily Job Search"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble site (setup UI + jobs dashboard)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a docs/. _site/
          if git ls-remote --exit-code --heads origin job-search-data >/dev/null 2>&1; then
            git fetch --depth=1 origin job-search-data
            if git show FETCH_HEAD:data/dashboard.html > _site/jobs.html 2>/dev/null; then
              echo "Included jobs dashboard from job-search-data branch."
            else
              rm -f _site/jobs.html
              echo "No dashboard.html on data branch yet."
            fi
          else
            echo "No job-search-data branch yet; deploying setup UI only."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
