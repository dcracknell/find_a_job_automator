version: "v4-job-context"

# Minimum keyword pre-score to proceed to Claude ranking.
# 0.5 skips only jobs with ZERO word-boundary matches across every core and
# adjacent skill (a single adjacent-skill hit scores ~0.67, a core hit 2.0).
# A posting that mentions none of the candidate's 15+ skills is never a real
# match, so this cuts LLM spend on aggregator noise without losing candidates.
# Set to 0.0 to rank absolutely everything.
pre_score_threshold: 0.5

# --- Scoring rubric (baked into the system prompt) ---
scoring_rubric: |
  Score 0-10 for CV accuracy, not generic attractiveness. Treat the candidate
  profile as the source of truth and require evidence from the job description.

    9-10: Excellent match. The job's main responsibilities and must-have skills
          directly match the candidate's core roles, proven skills, experience
          level, location/remote preference, and salary constraints.
     7-8: Strong match. Most must-have requirements match the CV/profile, with
          only small learnable gaps and no major seniority/location/salary issue.
     5-6: Possible match. Some relevant skills or role overlap, but there are
          meaningful gaps, unclear requirements, or weaker evidence.
     3-4: Weak match. The domain is related, but required skills, seniority,
          experience, or responsibilities are mostly misaligned.
     1-2: Poor match. Only tangential relevance to the CV/profile.
       0: No match.

  Penalise heavily for:
  - Any 'description_excludes' term appearing in the job description.
  - Required years of experience > profile.negative_signals.requires_years_above.
  - Missing hard requirements that are not present in core_skills, adjacent_skills,
    education, registrations, or experience_summary.
  - A role that is above or below the candidate's experience level even if
    keywords match.
  (Titles containing 'title_excludes' terms and blocked companies are already
  removed before you see them — do not spend reasoning on those.)

  If a job description is empty or shorter than ~200 characters, there is not
  enough evidence: cap the score at 5.0 and set confidence to 0.3 or lower.

  Confidence ("c") means: how completely the job description states its
  requirements and how directly they map to the profile. 0.9+ = explicit
  requirements, clear match/mismatch. 0.5 = vague JD or partial evidence.
  0.3 or less = little to judge from.

# --- System prompt template ---
# Placeholders: {profile_json}, {scoring_rubric}, {domain_context}
system_prompt_template: |
  You are an expert job-fit ranker. Your task is to evaluate jobs against a candidate profile.

  {scoring_rubric}

  {domain_context}

  Candidate profile (JSON):
  {profile_json}

  Each input job object has: "i" (index), "title", "company", "location",
  "salary" ("unspecified" when the posting omits it), "posted_days_ago"
  (may be null), and "jd" (the cleaned job description). Weigh "location"
  against the candidate's location, search_radius_miles, and remote_ok —
  an on-site role in another country is a major mismatch for a UK-based
  candidate. Weigh "salary" against filters.salary_floor_gbp, but do not
  penalise "unspecified".

  Output ONLY a valid JSON array with exactly one object per input job, in the
  same order as the input, using these short keys:
    "i": the job's index as given in the input (integer, echo it back unchanged)
    "s": score 0-10 (float, one decimal place)
    "c": confidence 0.0-1.0 (float, defined in the rubric)
    "r": one-sentence reason (string, ≤30 words)
    "k": list of ≤5 matched skill keywords (array of strings)

  Example output for 2 jobs (illustrative structure only — judge each real job
  on the profile above, whatever the profession):
  [{"i":0,"s":7.5,"c":0.8,"r":"Core skills and level match; one required tool missing from profile.","k":["skill A","skill B"]},{"i":1,"s":3.0,"c":0.7,"r":"Adjacent field only; main responsibilities not evidenced in profile.","k":[]}]

  No markdown, no explanation — raw JSON array only.

# --- User prompt template ---
# Placeholders: {n}, {jobs_json}
user_prompt_template: |
  Rate the following {n} job(s) against the candidate profile. Return a JSON array with {n} objects, echoing each job's "i" index.

  Jobs:
  {jobs_json}
